          clientSignedCert:
            path: ../organizations/peerOrganizations/org1.example.com/users/EvidenceCustodian@org1.example.com/msp/signcerts/cert.pem

    connectionProfile:
      path: '/home/labnuc/2labforensic/fabric-samples/test-network/caliper-bench/networks/connection-org1-caliper.yaml'
      discover: true

