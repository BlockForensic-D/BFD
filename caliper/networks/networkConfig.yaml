name: Network-BlockForensicD-Caliper
version: "2.0.0"

caliper:
  blockchain: fabric

channels:
  - channelName: forensic-channel
    contracts:
      - id: forensicContract

organizations:
  - mspid: Org1MSP
    identities:
      certificates:
        - name: 'GatewayCollector'
          clientPrivateKey:
            path: ../organizations/peerOrganizations/org1.example.com/users/GatewayCollector@org1.example.com/msp/keystore/priv_sk
          clientSignedCert:
            path: ../organizations/peerOrganizations/org1.example.com/users/GatewayCollector@org1.example.com/msp/signcerts/cert.pem

        - name: 'EvidenceCustodian'
          clientPrivateKey:
